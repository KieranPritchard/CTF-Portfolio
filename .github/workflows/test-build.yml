name: Test Build
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: set-up-node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install-deps
        run: npm install

      - name: run-build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/